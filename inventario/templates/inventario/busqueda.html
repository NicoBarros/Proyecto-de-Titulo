{% extends 'inventario/base.html' %}

{% block content %}
<div class="card">
  <h2>Búsqueda inteligente (RF-11 / RNF-06)</h2>
  <form id="fBusqueda" class="inline" onsubmit="buscarIA(event)">
    {% csrf_token %}
    <div class="field" style="flex:1"><label>Describe lo que necesitas</label>
      <input name="consulta" id="consulta" style="width:100%"
        placeholder="ej: necesito algo para armar una red con 3 routers para la clase de mañana" required>
    </div>
    <button class="btn" type="submit">Buscar con Gemini</button>
  </form>
  <div id="resBusqueda"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Los datos vienen de la BD (p. ej. importados por CSV): se insertan con
  // textContent, nunca como HTML, para evitar XSS.
  function el(tag, texto, clase) {
    const n = document.createElement(tag);
    if (texto !== undefined) n.textContent = texto;
    if (clase) n.className = clase;
    return n;
  }

  async function buscarIA(e) {
    e.preventDefault();
    const consulta = document.getElementById('consulta').value;
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const res = document.getElementById('resBusqueda');

    res.innerHTML = 'Buscando con Inteligencia Artificial...';

    try {
      const formData = new FormData();
      formData.append('consulta', consulta);

      const resp = await fetch('{% url "busqueda" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': csrf },
        body: formData
      });

      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Error en la búsqueda');

      res.replaceChildren(el('p', `Fuente: ${data.fuente}`, 'hint'));
      if (data.resultados.length > 0) {
        const tabla = el('table');
        tabla.innerHTML = '<thead><tr><th>Equipo</th><th>Código</th><th>Estado</th></tr></thead>';
        const tbody = el('tbody');
        data.resultados.forEach(r => {
          const tr = el('tr');
          const tdEstado = el('td');
          tdEstado.append(el('span', r.estado, 'badge ' + r.estado.toLowerCase().replace(/ /g, '_')));
          tr.append(el('td', r.nombre), el('td', r.codigo_inventario), tdEstado);
          tbody.append(tr);
        });
        tabla.append(tbody);
        res.append(tabla);
      } else {
        res.append(el('p', 'No se encontraron equipos relevantes disponibles.'));
      }
    } catch (err) {
      res.replaceChildren(el('div', err.message, 'msg error'));
    }
  }
</script>
{% endblock %}
