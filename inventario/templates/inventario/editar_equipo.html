{% extends 'inventario/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2>Editar Equipo: {{ equipo.nombre }}</h2>
  <form method="post">
    {% csrf_token %}
    <div class="field" style="margin-bottom:10px;"><label>Código*</label><input name="codigo_inventario" value="{{ form.codigo_inventario.value }}" required></div>
    <div class="field" style="margin-bottom:10px;"><label>Nombre*</label><input name="nombre" value="{{ form.nombre.value }}" required></div>
    <div class="field" style="margin-bottom:10px;"><label>Modelo</label><input name="modelo" value="{{ form.modelo.value|default:'' }}"></div>
    <div class="field" style="margin-bottom:10px;"><label>Ubicación</label><input name="ubicacion" value="{{ form.ubicacion.value|default:'' }}"></div>
    <div class="field" style="margin-bottom:10px;"><label>Especificaciones</label><textarea name="especificaciones">{{ form.especificaciones.value|default:'' }}</textarea></div>
    <div class="field" style="margin-bottom:15px;"><label>Valor ($)</label><input name="valor_adquisicion" type="number" step="0.01" value="{{ form.valor_adquisicion.value|default:'' }}"></div>
    
    <button class="btn" type="submit">Guardar Cambios</button>
    <a href="{% url 'inventario' %}?tab=equipos" class="btn secundario" style="text-decoration:none; display:inline-block;">Cancelar</a>
  </form>
</div>
{% endblock %}
