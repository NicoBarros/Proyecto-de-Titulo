{% extends 'inventario/base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-pencil-square me-2"></i>Editar Equipo</span>
        <span class="badge bg-secondary">{{ equipo.codigo_inventario }}</span>
      </div>
      <div class="card-body p-4">
        <h5 class="card-title fw-bold text-dark mb-3">{{ equipo.nombre }}</h5>
        
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Código de Inventario *</label>
            <input type="text" name="codigo_inventario" class="form-control" value="{{ form.codigo_inventario.value }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Nombre del Equipo *</label>
            <input type="text" name="nombre" class="form-control" value="{{ form.nombre.value }}" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Modelo</label>
              <input type="text" name="modelo" class="form-control" value="{{ form.modelo.value|default:'' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold small">Ubicación</label>
              <input type="text" name="ubicacion" class="form-control" value="{{ form.ubicacion.value|default:'' }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Especificaciones Técnicas</label>
            <textarea name="especificaciones" class="form-control" rows="3">{{ form.especificaciones.value|default:'' }}</textarea>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Valor de Adquisición ($)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" step="0.01" name="valor_adquisicion" class="form-control" value="{{ form.valor_adquisicion.value|default:'' }}">
            </div>
          </div>
          
          <div class="d-flex justify-content-between align-items-center pt-2 border-top">
            <a href="{% url 'inventario' %}?tab=equipos" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>Cancelar
            </a>
            <button class="btn btn-leica" type="submit">
              <i class="bi bi-check-lg me-1"></i>Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
